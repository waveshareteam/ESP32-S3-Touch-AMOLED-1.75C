name: Build Examples

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "all, an example name, or a repo-relative example path"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: examples-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      routing: ${{ steps.classify.outputs.routing }}
      idf_mode: ${{ steps.classify.outputs.idf_mode }}
      idf_selector: ${{ steps.classify.outputs.idf_selector }}
      arduino_mode: ${{ steps.classify.outputs.arduino_mode }}
      arduino_selector: ${{ steps.classify.outputs.arduino_selector }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      firmware_changed: ${{ steps.classify.outputs.firmware_changed }}
      release_review: ${{ steps.classify.outputs.release_review }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run lightweight repository policy tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          if [ "$FORCE_ALL" = "true" ]; then
            python3 scripts/classify_changes.py --repo . --all --config ci-routing-config.json --github-output "$GITHUB_OUTPUT"
          else
            if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" || ! git cat-file -e "${HEAD}^{commit}"; then
              echo "A complete base/head diff is required for CI routing." >&2
              exit 2
            fi
            git -c core.quotepath=false diff --name-status --find-renames "$BASE...$HEAD" > changed-files.txt
            python3 scripts/classify_changes.py --repo . --changed-files-from changed-files.txt --config ci-routing-config.json --github-output "$GITHUB_OUTPUT"
          fi
      - name: Summarize change routing
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          FIRMWARE_CHANGED: ${{ steps.classify.outputs.firmware_changed }}
          RELEASE_REVIEW: ${{ steps.classify.outputs.release_review }}
          IDF_MODE: ${{ steps.classify.outputs.idf_mode }}
          ARDUINO_MODE: ${{ steps.classify.outputs.arduino_mode }}
        run: |
          {
            echo "### Example CI routing"
            echo "- Documentation-only: $DOCS_ONLY"
            echo "- ESP-IDF route: $IDF_MODE"
            echo "- Arduino route: $ARDUINO_MODE"
            echo "- Firmware scope touched: $FIRMWARE_CHANGED"
            echo "- Immutable artifact review required: $RELEASE_REVIEW"
          } >> "$GITHUB_STEP_SUMMARY"

  discover-esp-idf:
    needs: classify-changes
    if: needs.classify-changes.outputs.idf_mode != 'none'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        run: |
          python3 scripts/discover_examples.py \
            --surface esp-idf \
            --selector "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || needs.classify-changes.outputs.idf_selector }}" \
            --idf-versions v5.5.5,v6.0.2 \
            --github-output "$GITHUB_OUTPUT"

  build-esp-idf:
    needs: discover-esp-idf
    if: needs.discover-esp-idf.outputs.count != '0'
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-esp-idf.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.path }} with ESP-IDF ${{ matrix.idf }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          idf.py -C "${{ matrix.path }}" -B "build/${{ matrix.name }}-${{ matrix.idf }}" set-target esp32s3 build
      - name: Package firmware
        shell: bash
        run: |
          python3 releases/package_firmware.py \
            --framework esp-idf \
            --project "${{ matrix.path }}" \
            --build-dir "build/${{ matrix.name }}-${{ matrix.idf }}" \
            --name "ESP32-S3-Touch-AMOLED-1.75C-${{ matrix.name }}-${{ matrix.idf }}" \
            --framework-version "${{ matrix.idf }}" \
            --target esp32s3 \
            --git-sha "${{ github.sha }}" \
            --output-dir release-artifacts
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp-idf-${{ matrix.name }}-${{ matrix.idf }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  discover-arduino:
    needs: classify-changes
    if: needs.classify-changes.outputs.arduino_mode != 'none'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        run: |
          python3 scripts/discover_examples.py \
            --surface arduino \
            --selector "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || needs.classify-changes.outputs.arduino_selector }}" \
            --arduino-core 3.3.11 \
            --github-output "$GITHUB_OUTPUT"

  build-arduino:
    needs: discover-arduino
    if: needs.discover-arduino.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-arduino.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
      - name: Compile ${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ino_files < <(find "${{ matrix.path }}" -maxdepth 1 -name "*.ino" | sort)
          if [[ "${#ino_files[@]}" -eq 0 ]]; then
            echo "No .ino file found in ${{ matrix.path }}" >&2
            exit 1
          fi
          sketch_name="$(basename "${ino_files[0]}" .ino)"
          normalized_sketch="$RUNNER_TEMP/arduino-sketches/$sketch_name"
          mkdir -p "$normalized_sketch"
          cp -R "${{ matrix.path }}/." "$normalized_sketch/"
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --libraries examples/arduino/libraries \
            --export-binaries \
            --output-dir "build/${{ matrix.name }}-${{ matrix.core }}" \
            "$normalized_sketch"
      - name: Package firmware
        run: |
          python3 releases/package_firmware.py \
            --framework arduino \
            --project "${{ matrix.path }}" \
            --build-dir "build/${{ matrix.name }}-${{ matrix.core }}" \
            --name "ESP32-S3-Touch-AMOLED-1.75C-${{ matrix.name }}-arduino-${{ matrix.core }}" \
            --framework-version "${{ matrix.core }}" \
            --target esp32s3 \
            --git-sha "${{ github.sha }}" \
            --output-dir release-artifacts
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-arduino-${{ matrix.name }}-${{ matrix.core }}
          path: release-artifacts/*.zip
          if-no-files-found: error
