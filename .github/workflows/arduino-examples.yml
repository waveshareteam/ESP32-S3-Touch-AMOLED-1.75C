name: Arduino examples

on:
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/arduino-examples.yml"
      - ".github/scripts/discover_arduino_sketches.py"
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - ".github/workflows/arduino-examples.yml"
      - ".github/scripts/discover_arduino_sketches.py"
  workflow_dispatch:
    inputs:
      sketch:
        description: "Arduino sketch directory name, path, ino file name, or all"
        required: false
        default: "all"

permissions:
  contents: read

env:
  ARDUINO_CORE_VERSION: "3.3.10"
  ESP32_PACKAGE_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
  ESP32_FQBN: "esp32:esp32:esp32s3"
  ARDUINO_LIBRARIES: "examples/Arduino-v3.3.5/libraries"

jobs:
  discover:
    name: Discover sketches
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sketches.outputs.matrix }}
      has_sketches: ${{ steps.sketches.outputs.has_sketches }}
      sketches: ${{ steps.sketches.outputs.sketches }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed Arduino sketches
        id: sketches
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python .github/scripts/discover_arduino_sketches.py \
              --sketch "${{ inputs.sketch }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python .github/scripts/discover_arduino_sketches.py \
              --base-ref "${{ github.event.pull_request.base.sha }}" \
              --head-ref "${{ github.sha }}" \
              --fallback-all
          else
            before="${{ github.event.before }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              before=""
            fi
            python .github/scripts/discover_arduino_sketches.py \
              --base-ref "$before" \
              --head-ref "${{ github.sha }}" \
              --fallback-all
          fi

      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.sketches.outputs.has_sketches }}" == "true" ]]; then
            {
              echo "### Arduino sketches selected"
              echo
              echo '${{ steps.sketches.outputs.sketches }}' | tr ',' '\n' | sed '/^$/d' | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Arduino sketch changes detected." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.sketch }}
    needs: discover
    if: needs.discover.outputs.has_sketches == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$ESP32_PACKAGE_URL"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@$ARDUINO_CORE_VERSION"

      - name: Compile sketch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ino_files < <(find "${{ matrix.sketch }}" -maxdepth 1 -name "*.ino" | sort)
          if [[ "${#ino_files[@]}" -eq 0 ]]; then
            echo "No .ino file found in ${{ matrix.sketch }}" >&2
            exit 1
          fi
          sketch_name="$(basename "${ino_files[0]}" .ino)"
          normalized_sketch="$RUNNER_TEMP/arduino-sketches/$sketch_name"
          mkdir -p "$normalized_sketch"
          cp -R "${{ matrix.sketch }}/." "$normalized_sketch/"
          arduino-cli compile \
            --fqbn "$ESP32_FQBN" \
            --libraries "$ARDUINO_LIBRARIES" \
            --warnings default \
            "$normalized_sketch"